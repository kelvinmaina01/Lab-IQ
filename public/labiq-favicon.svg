<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Hexagon (Benzene/Science) -->
  <path d="M256 32 L464 140 L464 372 L256 480 L48 372 L48 140 Z" 
        fill="none" 
        stroke="url(#grad1)" 
        stroke-width="24"
        stroke-linecap="round"
        stroke-linejoin="round"/>
        
  <!-- Inner Brain Circuit -->
  <path d="M256 120 C180 120, 140 180, 140 256 C140 332, 180 392, 256 392 C332 392, 372 332, 372 256 C372 180, 332 120, 256 120"
        fill="none"
        stroke="#06b6d4"
        stroke-width="16"
        stroke-opacity="0.6"/>
        
  <!-- Neural Nodes -->
  <circle cx="256" cy="180" r="16" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="200" cy="280" r="14" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="312" cy="280" r="14" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="256" cy="340" r="12" fill="#8b5cf6" filter="url(#glow)"/>
  
  <!-- Connections -->
  <line x1="256" y1="180" x2="200" y2="280" stroke="white" stroke-width="4" stroke-opacity="0.5"/>
  <line x1="256" y1="180" x2="312" y2="280" stroke="white" stroke-width="4" stroke-opacity="0.5"/>
  <line x1="200" y1="280" x2="256" y2="340" stroke="white" stroke-width="4" stroke-opacity="0.5"/>
  <line x1="312" y1="280" x2="256" y2="340" stroke="white" stroke-width="4" stroke-opacity="0.5"/>
  <line x1="200" y1="280" x2="312" y2="280" stroke="white" stroke-width="4" stroke-opacity="0.5"/>
  
</svg>
